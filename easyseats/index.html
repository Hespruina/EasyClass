<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>教室座位编排</title>
<style>
  /* randamer 同款字体 */
  @import url('https://google-fonts.mirrors.sjtug.sjtu.edu.cn/css2?family=Noto+Sans+SC:wght@100..900&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap');

  /* ============ 设计变量（对齐 randamer，不含发光） ============ */
  :root {
    --bg:        #23242a;   /* 页面底色 */
    --panel:     #1c1c1c;   /* 面板 / 容器 */
    --panel-2:   #28292d;   /* 次级面板 */
    --line:      #33343b;   /* 分隔线 */
    --accent:    #45f3ff;   /* 主色 */
    --accent-hi: #35eaff;   /* 主色 hover */
    --accent-lo: #25daff;   /* 主色 active */
    --muted:     #8f8f8f;   /* 次要文字 */
    --gray:      #666;      /* 中性按钮 / 未选中轨道 */
    --danger:    #ff6b6b;
    --warn:      #ffd700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0;
      font-family: "Noto Sans SC", sans-serif; font-optical-sizing: auto; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
    background: var(--bg);
    color: var(--accent);
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  /* ============ 顶栏 ============ */
  #topbar {
    position: relative;
    flex: 0 0 auto;
    height: 52px;
    background: var(--panel);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 15px;
    user-select: none;
    border-bottom: 2px solid var(--accent);
    z-index: 10;
    padding: 0 16px;
  }

  /* 开关（对齐 randamer 的 slider 配色） */
  .switch-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    transition: background .3s;
  }
  .switch-wrap:hover { background: rgba(69,243,255,.10); }

  .switch {
    position: relative;
    width: 42px;
    height: 22px;
    background: var(--gray);
    border-radius: 11px;
    transition: background .3s;
    flex-shrink: 0;
  }
  .switch::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    left: 2px; top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: transform .3s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(20px); }

  /* 手动建组按钮（randamer 的 .anniu：青底深字 + 4px 圆角） */
  #manualGroupBtn {
    background: var(--accent);
    color: var(--panel);
    border: none;
    outline: none;
    font: inherit;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-style: normal;
    font-size: 14px;
    padding: 6px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: background .3s, transform .3s;
    white-space: nowrap;
  }
  #manualGroupBtn:hover { background: var(--accent-hi); }
  #manualGroupBtn:active { background: var(--accent-lo); transform: scale(.95); }
  #manualGroupBtn.active {
    background: var(--warn);
    color: var(--panel);
    transform: none;
  }
  #manualGroupBtn.active:hover { background: var(--warn); }

  #manualActions {
    position: absolute; right: 16px; top: 50%;
    transform: translateY(-50%);
    display: flex; gap: 8px;
  }
  #manualActions button {
    border: none;
    outline: none;
    font: inherit;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-style: normal;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: background .3s;
  }
  #finishBtn { background: var(--accent); color: var(--panel); }
  #finishBtn:hover { background: var(--accent-hi); }
  #cancelBtn { background: var(--gray); color: #fff; }
  #cancelBtn:hover { background: #757575; }

  #zoomHint {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--muted);
    pointer-events: none;
    user-select: none;
  }

  /* ============ 画布 ============ */
  #canvas {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    user-select: none;
    touch-action: none;      /* 画布内不留任何浏览器原生平移 / 缩放 */
    cursor: crosshair;
  }
  #canvas.grid-bg {
    background-image:
      linear-gradient(to right, #2c2d34 1px, transparent 1px),
      linear-gradient(to bottom, #2c2d34 1px, transparent 1px);
    background-size: 56px 56px;
  }
  #world {
    position: absolute;
    left: 0; top: 0;
    width: 0; height: 0;
    transform-origin: 0 0;
    will-change: transform;
    touch-action: none;
  }
  #canvas::after {
    content: '从下方拖拽「座位」到此处开始编排';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #55565e;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 18px;
    pointer-events: none;
    display: none;
    white-space: nowrap;
  }
  #canvas.empty::after { display: block; }

  /* ============ 座位 ============ */
  /* 座位：深底 + 青色描边（randamer 的输入框语言） */
  .seat {
    position: absolute;
    width: 46px; height: 46px;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    cursor: move;
    user-select: none;
    z-index: 3;
    transition: background .2s, border-color .2s;
  }
  .seat:hover { background: rgba(69,243,255,.14); }
  .seat.selected { background: rgba(69,243,255,.22); outline: 2px solid var(--warn); outline-offset: 2px; }
  .seat.dragging { opacity: .85; z-index: 999; cursor: grabbing; }

  .ghost {
    position: fixed;
    width: 46px; height: 46px;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    opacity: .8;
    pointer-events: none;
    z-index: 99999;
  }

  .select-box {
    position: absolute;
    border: 1px solid var(--accent-lo);
    background: rgba(69,243,255,.10);
    pointer-events: none;
    z-index: 50;
  }

  .group-frame {
    position: absolute;
    border: 2px dashed var(--gray);
    border-radius: 10px;
    pointer-events: none;
    z-index: 1;
  }
  .group-label {
    position: absolute;
    top: -11px; left: 10px;
    font-size: 12px;
    line-height: 20px;
    height: 20px;
    color: var(--panel);
    padding: 0 8px;
    border-radius: 10px;
    white-space: nowrap;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-weight: 400;
  }

  /* ============ 底栏 ============ */
  #bottomBar {
    flex: 0 0 auto;
    height: 118px;
    border-top: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    position: relative;
    z-index: 20;
  }
  #seatSource {
    width: 56px; height: 56px;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    border-radius: 6px;
    cursor: grab;
    user-select: none;
    transition: transform .2s, background .2s;
  }
  #seatSource:hover { background: rgba(69,243,255,.14); transform: translateY(-2px); }
  #seatSource:active { cursor: grabbing; transform: scale(.96); }

  /* 操作提示（桌面端才显示） */
  #opHint {
    position: absolute; left: 20px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
    pointer-events: none;
    user-select: none;
  }
  #opHint b {
    color: var(--accent);
    font-weight: 400;
    font-family: "ZCOOL KuaiLe", sans-serif;
  }
  @media (max-width: 760px) { #opHint { display: none; } }

  /* ============ 菜单 ============ */
  .menu {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 0;
    z-index: 100000;
    min-width: 132px;
    overflow: hidden;
    animation: menuIn .15s ease-out;
  }
  @keyframes menuIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  .menu-item {
    padding: 9px 18px;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s;
  }
  .menu-item:hover { background: rgba(69,243,255,.12); }
  .menu-item.danger { color: var(--danger); }
  .menu-item.danger:hover { background: rgba(255,107,107,.14); }
</style>
</head>
<body>

<div id="topbar">
  <span id="zoomHint">缩放 100%</span>

  <div class="switch-wrap" id="gridSwitchWrap">
    <div class="switch on" id="gridSwitch"></div>
    <span>网格对齐</span>
  </div>

  <button id="manualGroupBtn">手动建组</button>

  <div id="manualActions" style="display:none">
    <button id="finishBtn">✓ 完成</button>
    <button id="cancelBtn">✕ 取消</button>
  </div>
</div>

<div id="canvas">
  <div id="world"></div>
</div>

<div id="bottomBar">
  <div id="seatSource">座位</div>
  <div id="opHint">左键框选：框住座位 = 建组 / 批量删除，框住空白 = 批量建座</div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== 常量 ==================== */
  const SEAT = 46;
  const CELL = 56;
  const PAD  = (CELL - SEAT) / 2;
  const GROUP_COLORS = ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8',
                        '#4db6ac','#f06292','#9575cd','#aed581','#4fc3f7',
                        '#ffd54f','#a1887f'];
  const MIN_SCALE = 0.25;
  const MAX_SCALE = 4;
  const WORLD_MARGIN = 4000;

  /* ==================== DOM ==================== */
  const canvas      = document.getElementById('canvas');
  const world       = document.getElementById('world');
  const bottomBar   = document.getElementById('bottomBar');
  const seatSource  = document.getElementById('seatSource');
  const zoomHint    = document.getElementById('zoomHint');
  const gridSwitch  = document.getElementById('gridSwitch');
  const gridSwitchWrap = document.getElementById('gridSwitchWrap');
  const manualGroupBtn = document.getElementById('manualGroupBtn');
  const manualActions  = document.getElementById('manualActions');
  const finishBtn   = document.getElementById('finishBtn');
  const cancelBtn   = document.getElementById('cancelBtn');

  /* ==================== 状态 ==================== */
  let seats = [];
  let groups = [];
  let seatSeq = 0;
  let groupSeq = 0;

  let gridAlign = true;
  let manualGrouping = false;
  let manualSelected = new Set();

  let currentMenu = null;

  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ================================================================
   *  坐标换算
   * ================================================================ */
  function screenToWorld(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left - offsetX) / scale,
      y: (clientY - r.top  - offsetY) / scale
    };
  }

  function applyTransform() {
    world.style.transform =
      `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    canvas.style.backgroundSize =
      (CELL * scale) + 'px ' + (CELL * scale) + 'px';
    canvas.style.backgroundPosition =
      offsetX + 'px ' + offsetY + 'px';
    zoomHint.textContent = '缩放 ' + Math.round(scale * 100) + '%';
  }

  function zoomAt(clientX, clientY, newScale) {
    newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);
    if (newScale === scale) return;

    const r = canvas.getBoundingClientRect();
    const px = clientX - r.left;
    const py = clientY - r.top;

    const wx = (px - offsetX) / scale;
    const wy = (py - offsetY) / scale;

    scale = newScale;
    offsetX = px - wx * scale;
    offsetY = py - wy * scale;

    applyTransform();
  }

  /* ================================================================
   *  屏蔽浏览器手势（左键 / 右键 / 中键一视同仁）
   * ================================================================ */

  // 1) 拖拽、文本选择、右键菜单、中键粘贴、Safari 捏合手势 —— 全部吃掉
  ['dragstart', 'drag', 'selectstart', 'contextmenu', 'auxclick',
   'gesturestart', 'gesturechange', 'gestureend'].forEach(ev => {
    document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  });

  // 2) 鼠标按下即接管：左键不选中 / 不拖图，右键不弹菜单，中键不进入自动滚动
  //    表单控件放行，保留原生输入行为
  document.addEventListener('mousedown', e => {
    const t = e.target;
    if (t instanceof Element && t.closest('input, textarea, select, [contenteditable]')) return;
    e.preventDefault();
  }, { passive: false });

  // 3) 触控板 / Ctrl+滚轮不缩放整页（缩放一律交给画布自己处理）
  window.addEventListener('wheel', e => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  // 4) 顺带屏蔽 Ctrl +/-/0 的整页缩放，避免页面缩放后坐标换算错位
  window.addEventListener('keydown', e => {
    if (e.ctrlKey && ['+', '-', '=', '_', '0'].indexOf(e.key) >= 0) e.preventDefault();
  }, { passive: false });

  /* ================================================================
   *  缩放交互
   * ================================================================ */

  canvas.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomAt(e.clientX, e.clientY, scale * factor);
  }, { passive: false });

  const touches = new Map();
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchStartMid = { x: 0, y: 0 };
  let pinchStartOffset = { x: 0, y: 0 };
  let singleStart = null;

  canvas.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    }

    if (touches.size === 2) {
      const pts = [...touches.values()];
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      pinchStartScale = scale;
      pinchStartMid = {
        x: (pts[0].x + pts[1].x) / 2,
        y: (pts[0].y + pts[1].y) / 2
      };
      pinchStartOffset = { x: offsetX, y: offsetY };
      singleStart = null;
    } else if (touches.size === 1) {
      const t = e.changedTouches[0];
      singleStart = { x: t.clientX, y: t.clientY, ox: offsetX, oy: offsetY,
                      target: t.target };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (touches.size === 2) {
      e.preventDefault();
      const pts = [...touches.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchStartDist < 1) return;

      const mid = {
        x: (pts[0].x + pts[1].x) / 2,
        y: (pts[0].y + pts[1].y) / 2
      };

      const newScale = clamp(pinchStartScale * (dist / pinchStartDist),
                             MIN_SCALE, MAX_SCALE);
      const r = canvas.getBoundingClientRect();

      const px = mid.x - r.left;
      const py = mid.y - r.top;
      const wx = (pinchStartMid.x - r.left - pinchStartOffset.x) / pinchStartScale;
      const wy = (pinchStartMid.y - r.top  - pinchStartOffset.y) / pinchStartScale;

      scale = newScale;
      offsetX = px - wx * scale + (mid.x - pinchStartMid.x);
      offsetY = py - wy * scale + (mid.y - pinchStartMid.y);

      applyTransform();
      return;
    }

    if (touches.size === 1 && singleStart) {
      const t = e.changedTouches[0];
      const dx = t.clientX - singleStart.x;
      const dy = t.clientY - singleStart.y;
      if (singleStart.target === canvas && Math.hypot(dx, dy) > 6) {
        e.preventDefault();
        offsetX = singleStart.ox + dx;
        offsetY = singleStart.oy + dy;
        applyTransform();
      }
    }
  }, { passive: false });

  function endTouch(e) {
    for (const t of e.changedTouches) {
      touches.delete(t.identifier);
    }
    if (touches.size < 2) pinchStartDist = 0;
    if (touches.size === 0) {
      singleStart = null;
    } else if (touches.size === 1) {
      const t = [...touches.values()][0];
      singleStart = { x: t.x, y: t.y, ox: offsetX, oy: offsetY, target: canvas };
    }
  }
  canvas.addEventListener('touchend', endTouch);
  canvas.addEventListener('touchcancel', endTouch);

  /* ================================================================
   *  座位基础操作
   * ================================================================ */

  function clampWorld(v) {
    return clamp(v, -WORLD_MARGIN, WORLD_MARGIN);
  }

  // 坐标 → 网格号（供吸附与刷座共用，保证取整规则一致）
  function cellAt(x, y) {
    const maxCells = Math.ceil(WORLD_MARGIN / CELL);
    return {
      col: clamp(Math.round((x - PAD) / CELL), -maxCells, maxCells),
      row: clamp(Math.round((y - PAD) / CELL), -maxCells, maxCells)
    };
  }

  // 指定格子是否已被占用
  function isCellTaken(col, row) {
    return seats.some(s => s.col === col && s.row === row);
  }

  function findFreeCell(x, y, exclude) {
    const maxCells = Math.ceil(WORLD_MARGIN / CELL);

    const occupied = new Set();
    seats.forEach(s => {
      if (s !== exclude && s.col !== null && s.row !== null) {
        occupied.add(s.col + ',' + s.row);
      }
    });

    const start = cellAt(x, y);
    const col = start.col, row = start.row;
    if (!occupied.has(col + ',' + row)) return { col, row };

    for (let r = 1; r <= maxCells * 2; r++) {
      for (let dc = -r; dc <= r; dc++) {
        for (let dr = -r; dr <= r; dr++) {
          if (Math.abs(dc) !== r && Math.abs(dr) !== r) continue;
          const c = col + dc, rr = row + dr;
          if (c < -maxCells || rr < -maxCells ||
              c >  maxCells || rr >  maxCells) continue;
          if (!occupied.has(c + ',' + rr)) return { col: c, row: rr };
        }
      }
    }
    return null;
  }

  // 按最终世界坐标落一个座位（col / row 为网格号，非吸附时为 null）
  function createSeatEl(x, y, col, row) {
    const seat = { id: ++seatSeq, x, y, col, row, groupId: null, el: null };

    const el = document.createElement('div');
    el.className = 'seat';
    el.textContent = '座位';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.addEventListener('mousedown', ev => onSeatMouseDown(ev, seat));
    el.addEventListener('touchstart', ev => onSeatTouchStart(ev, seat), { passive: false });

    world.appendChild(el);
    seat.el = el;
    seats.push(seat);
    updateEmpty();
    renderGroups();
    return seat;
  }

  function addSeat(worldX, worldY) {
    let col = null, row = null;
    let x = clampWorld(worldX), y = clampWorld(worldY);

    if (gridAlign) {
      const cell = findFreeCell(x, y, null);
      if (!cell) return null;
      col = cell.col;
      row = cell.row;
      x = col * CELL + PAD;
      y = row * CELL + PAD;
    }

    return createSeatEl(x, y, col, row);
  }

  // 按网格号落一个座位
  function createSeatAtCell(col, row) {
    return createSeatEl(col * CELL + PAD, row * CELL + PAD, col, row);
  }

  // 求一块世界坐标矩形覆盖到、且当前为空的格子。
  // 判定用「格子槽位」（每格占 CELL×CELL，座位居中、四周留 (CELL-SEAT)/2 间隙），
  // 而不是「座位矩形」——否则框落在两格之间的空隙里会一格都算不到。
  // 槽位边界正好是 CELL 的整数倍，因此任意小的一块（哪怕 1px）都至少落进一格。
  function cellsInRect(x1, y1, x2, y2) {
    const maxCells = Math.ceil(WORLD_MARGIN / CELL);
    const cells = [];

    let colFrom = Math.floor(x1 / CELL);
    let colTo   = (x2 > x1) ? Math.ceil(x2 / CELL) - 1 : colFrom;
    let rowFrom = Math.floor(y1 / CELL);
    let rowTo   = (y2 > y1) ? Math.ceil(y2 / CELL) - 1 : rowFrom;

    colFrom = Math.max(colFrom, -maxCells);
    colTo   = Math.min(colTo,   maxCells);
    rowFrom = Math.max(rowFrom, -maxCells);
    rowTo   = Math.min(rowTo,   maxCells);

    for (let col = colFrom; col <= colTo; col++) {
      for (let row = rowFrom; row <= rowTo; row++) {
        if (isCellTaken(col, row)) continue;        // 已有座位则跳过
        cells.push({ col, row });
      }
    }
    return cells;
  }

  function removeSeat(seat) {
    if (!seat) return;
    seat.el.remove();
    seats = seats.filter(s => s !== seat);
    manualSelected.delete(seat.id);
    updateEmpty();
    renderGroups();
  }

  function moveSeatEl(seat) {
    seat.el.style.left = seat.x + 'px';
    seat.el.style.top  = seat.y + 'px';
  }

  function updateEmpty() {
    canvas.classList.toggle('empty', seats.length === 0);
  }

  /* ================================================================
   *  座位拖拽（鼠标）
   * ================================================================ */

  function onSeatMouseDown(e, seat) {
    // ---- 右键：一键删除座位 ----
    if (e.button === 2) {
      e.preventDefault();
      e.stopPropagation();
      closeMenu();
      removeSeat(seat);
      return;
    }

    if (e.button !== 0) return;
    if (e.ctrlKey) return;

    e.preventDefault();
    e.stopPropagation();

    const start = screenToWorld(e.clientX, e.clientY);
    const origX = seat.x, origY = seat.y;
    let moved = false;

    function onMove(ev) {
      const now = screenToWorld(ev.clientX, ev.clientY);
      const dx = now.x - start.x;
      const dy = now.y - start.y;

      if (!moved && Math.hypot(dx * scale, dy * scale) > 4) {
        moved = true;
        seat.el.classList.add('dragging');
      }
      if (!moved) return;

      seat.x = clampWorld(origX + dx);
      seat.y = clampWorld(origY + dy);
      moveSeatEl(seat);

      const bb = bottomBar.getBoundingClientRect();
      seat.el.style.opacity = ev.clientY > bb.top ? '0.25' : '';

      renderGroups();
    }

    function onUp(ev) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      seat.el.classList.remove('dragging');
      seat.el.style.opacity = '';

      if (!moved) {
        if (manualGrouping) {
          toggleManualSelect(seat);
        } else if (seat.groupId) {
          const g = groups.find(x => x.id === seat.groupId);
          if (g) {
            showMenu(ev.clientX, ev.clientY, [
              { label: '更改组名', onClick: () => renameGroup(g) },
              { label: '解散小组', danger: true, onClick: () => dissolveGroup(g) }
            ]);
          }
        }
        return;
      }

      const bb = bottomBar.getBoundingClientRect();
      if (ev.clientY > bb.top) {
        removeSeat(seat);
        return;
      }

      if (gridAlign) {
        const cell = findFreeCell(seat.x, seat.y, seat);
        if (cell) {
          seat.col = cell.col;
          seat.row = cell.row;
          seat.x = seat.col * CELL + PAD;
          seat.y = seat.row * CELL + PAD;
        }
      } else {
        seat.x = clampWorld(seat.x);
        seat.y = clampWorld(seat.y);
      }
      moveSeatEl(seat);
      renderGroups();
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  /* ================================================================
   *  座位拖拽（触屏）
   * ================================================================ */
  function onSeatTouchStart(e, seat) {
    if (e.touches.length !== 1) return;
    e.stopPropagation();
    e.preventDefault();

    const t0 = e.changedTouches[0];
    const start = screenToWorld(t0.clientX, t0.clientY);
    const origX = seat.x, origY = seat.y;
    let moved = false;

    function onMove(ev) {
      if (ev.touches.length !== 1) return;
      const t = ev.changedTouches[0];
      const now = screenToWorld(t.clientX, t.clientY);
      const dx = now.x - start.x;
      const dy = now.y - start.y;

      if (!moved && Math.hypot(dx * scale, dy * scale) > 8) {
        moved = true;
        seat.el.classList.add('dragging');
      }
      if (!moved) return;

      ev.preventDefault();
      seat.x = clampWorld(origX + dx);
      seat.y = clampWorld(origY + dy);
      moveSeatEl(seat);

      const bb = bottomBar.getBoundingClientRect();
      seat.el.style.opacity = t.clientY > bb.top ? '0.25' : '';
      renderGroups();
    }

    function onEnd(ev) {
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      document.removeEventListener('touchcancel', onEnd);
      seat.el.classList.remove('dragging');
      seat.el.style.opacity = '';

      if (!moved) {
        if (manualGrouping) {
          toggleManualSelect(seat);
        } else if (seat.groupId) {
          const g = groups.find(x => x.id === seat.groupId);
          if (g) {
            const t = ev.changedTouches[0];
            showMenu(t.clientX, t.clientY, [
              { label: '更改组名', onClick: () => renameGroup(g) },
              { label: '解散小组', danger: true, onClick: () => dissolveGroup(g) }
            ]);
          }
        }
        return;
      }

      const t = ev.changedTouches[0];
      const bb = bottomBar.getBoundingClientRect();
      if (t && t.clientY > bb.top) {
        removeSeat(seat);
        return;
      }

      if (gridAlign) {
        const cell = findFreeCell(seat.x, seat.y, seat);
        if (cell) {
          seat.col = cell.col;
          seat.row = cell.row;
          seat.x = seat.col * CELL + PAD;
          seat.y = seat.row * CELL + PAD;
        }
      } else {
        seat.x = clampWorld(seat.x);
        seat.y = clampWorld(seat.y);
      }
      moveSeatEl(seat);
      renderGroups();
    }

    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
  }

  /* ================================================================
   *  从底栏拖出新座位
   * ================================================================ */

  seatSource.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();

    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.textContent = '座位';
    document.body.appendChild(ghost);

    function place(ev) {
      ghost.style.left = (ev.clientX - SEAT / 2) + 'px';
      ghost.style.top  = (ev.clientY - SEAT / 2) + 'px';
    }
    place(e);

    function onMove(ev) { place(ev); }

    function onUp(ev) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      ghost.remove();

      const r = canvas.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right &&
          ev.clientY >= r.top  && ev.clientY <= r.bottom) {
        const w = screenToWorld(ev.clientX, ev.clientY);
        addSeat(w.x - SEAT / 2, w.y - SEAT / 2);
      }
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  seatSource.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    e.preventDefault();

    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.textContent = '座位';
    document.body.appendChild(ghost);

    function place(t) {
      ghost.style.left = (t.clientX - SEAT / 2) + 'px';
      ghost.style.top  = (t.clientY - SEAT / 2) + 'px';
    }
    place(e.changedTouches[0]);

    function onMove(ev) {
      if (ev.touches.length !== 1) return;
      ev.preventDefault();
      place(ev.changedTouches[0]);
    }

    function onEnd(ev) {
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      document.removeEventListener('touchcancel', onEnd);
      ghost.remove();

      const t = ev.changedTouches[0];
      if (!t) return;
      const r = canvas.getBoundingClientRect();
      if (t.clientX >= r.left && t.clientX <= r.right &&
          t.clientY >= r.top  && t.clientY <= r.bottom) {
        const w = screenToWorld(t.clientX, t.clientY);
        addSeat(w.x - SEAT / 2, w.y - SEAT / 2);
      }
    }

    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
  }, { passive: false });

  /* ================================================================
   *  小组渲染
   * ================================================================ */

  function renderGroups() {
    world.querySelectorAll('.group-frame').forEach(el => el.remove());

    groups.forEach(g => {
      const members = seats.filter(s => s.groupId === g.id);
      if (!members.length) return;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      members.forEach(s => {
        minX = Math.min(minX, s.x);
        minY = Math.min(minY, s.y);
        maxX = Math.max(maxX, s.x + SEAT);
        maxY = Math.max(maxY, s.y + SEAT);
      });

      const pad = 10;
      const frame = document.createElement('div');
      frame.className = 'group-frame';
      frame.style.left   = (minX - pad) + 'px';
      frame.style.top    = (minY - pad) + 'px';
      frame.style.width  = (maxX - minX + pad * 2) + 'px';
      frame.style.height = (maxY - minY + pad * 2) + 'px';
      frame.style.borderColor = g.color;

      const label = document.createElement('span');
      label.className = 'group-label';
      label.style.background = g.color;
      label.textContent = g.name;
      frame.appendChild(label);

      world.appendChild(frame);
    });

    seats.forEach(s => {
      const g = groups.find(x => x.id === s.groupId);
      // 分组标识改为描边换色 + 加粗（新风格为扁平描边，不用外发光圈）
      s.el.style.borderColor = g ? g.color : '';
      s.el.style.borderWidth = g ? '2px' : '';
    });
  }

  /* ================================================================
   *  小组增删改
   * ================================================================ */

  function createGroupFromSeats(list, name) {
    groupSeq++;
    const g = {
      id: groupSeq,
      name: name || ('小组 ' + groupSeq),
      color: GROUP_COLORS[(groupSeq - 1) % GROUP_COLORS.length]
    };
    groups.push(g);
    list.forEach(s => { s.groupId = g.id; });
    renderGroups();
    return g;
  }

  function renameGroup(g) {
    const n = prompt('请输入新的组名：', g.name);
    if (n !== null && n.trim() !== '') {
      g.name = n.trim();
      renderGroups();
    }
  }

  function dissolveGroup(g) {
    seats.forEach(s => { if (s.groupId === g.id) s.groupId = null; });
    groups = groups.filter(x => x !== g);
    renderGroups();
  }

  /* ================================================================
   *  菜单
   * ================================================================ */

  function closeMenu() {
    if (currentMenu) {
      currentMenu.remove();
      currentMenu = null;
    }
  }

  function showMenu(x, y, items) {
    closeMenu();

    const menu = document.createElement('div');
    menu.className = 'menu';

    items.forEach(it => {
      const d = document.createElement('div');
      d.className = 'menu-item' + (it.danger ? ' danger' : '');
      d.textContent = it.label;
      d.addEventListener('click', ev => {
        ev.stopPropagation();
        closeMenu();
        it.onClick();
      });
      menu.appendChild(d);
    });

    document.body.appendChild(menu);

    const r = menu.getBoundingClientRect();
    if (x + r.width  > window.innerWidth)  x = window.innerWidth  - r.width  - 8;
    if (y + r.height > window.innerHeight) y = window.innerHeight - r.height - 8;
    menu.style.left = Math.max(4, x) + 'px';
    menu.style.top  = Math.max(4, y) + 'px';

    currentMenu = menu;
  }

  document.addEventListener('mousedown', e => {
    if (currentMenu && !currentMenu.contains(e.target)) closeMenu();
  }, true);

  /* ================================================================
   *  画布鼠标交互
   * ================================================================ */

  canvas.addEventListener('mousedown', e => {
    if (e.target !== canvas) return;

    // ---- 右键：快速新建座位 ----
    if (e.button === 2) {
      e.preventDefault();
      closeMenu();
      const w = screenToWorld(e.clientX, e.clientY);
      addSeat(w.x - SEAT / 2, w.y - SEAT / 2);
      return;
    }

    if (e.button !== 0) return;

    // ---- Ctrl + 左键：平移画布 ----
    if (e.ctrlKey) {
      e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      const ox = offsetX, oy = offsetY;

      function onMove(ev) {
        offsetX = ox + (ev.clientX - startX);
        offsetY = oy + (ev.clientY - startY);
        applyTransform();
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        canvas.style.cursor = 'crosshair';
      }
      canvas.style.cursor = 'grabbing';
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      return;
    }

    // ---- 普通左键：框选 ----
    e.preventDefault();
    closeMenu();

    const startCX = e.clientX, startCY = e.clientY;
    const startW = screenToWorld(e.clientX, e.clientY);

    let moved = false;
    let box = null;

    function onMove(ev) {
      if (!moved && Math.hypot(ev.clientX - startCX, ev.clientY - startCY) > 4) {
        moved = true;
        box = document.createElement('div');
        box.className = 'select-box';
        world.appendChild(box);
      }
      if (!moved || !box) return;

      const w = screenToWorld(ev.clientX, ev.clientY);
      const x1 = Math.min(startW.x, w.x);
      const y1 = Math.min(startW.y, w.y);
      const x2 = Math.max(startW.x, w.x);
      const y2 = Math.max(startW.y, w.y);

      box.style.left   = x1 + 'px';
      box.style.top    = y1 + 'px';
      box.style.width  = (x2 - x1) + 'px';
      box.style.height = (y2 - y1) + 'px';
    }

    function onUp(ev) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);

      if (moved && box) {
        const r = {
          x: parseFloat(box.style.left),
          y: parseFloat(box.style.top),
          w: parseFloat(box.style.width),
          h: parseFloat(box.style.height)
        };
        box.remove();

        const sel = seats.filter(s =>
          !(s.x + SEAT < r.x || s.x > r.x + r.w ||
            s.y + SEAT < r.y || s.y > r.y + r.h)
        );

        if (sel.length) {
          if (manualGrouping) {
            sel.forEach(s => {
              manualSelected.add(s.id);
              s.el.classList.add('selected');
            });
          } else {
            showMenu(ev.clientX, ev.clientY, [
              { label: '设为小组', onClick: () => createGroupFromSeats(sel) },
              { label: '批量删除', danger: true, onClick: () => sel.forEach(removeSeat) }
            ]);
          }
        } else if (!manualGrouping && (r.w > 0 || r.h > 0)) {
          // 框里一个座位都没有 → 视作「铺座」手势，提供批量创建
          // 不设最小尺寸门槛：哪怕只框住不到一格空白，也照样给按钮
          let cells = cellsInRect(r.x, r.y, r.x + r.w, r.y + r.h);
          if (!cells.length) {
            // 框正好卡在座位之间的缝隙里（覆盖到的格子全被占）→ 退一步取最近的空格
            const c = findFreeCell(r.x + r.w / 2, r.y + r.h / 2, null);
            if (c) cells = [c];
          }
          if (cells.length) {
            showMenu(ev.clientX, ev.clientY, [{
              label: '批量创建座位（' + cells.length + '）',
              onClick: () => cells.forEach(c => createSeatAtCell(c.col, c.row))
            }]);
          }
        }
        return;
      }

      if (manualGrouping) {
        manualSelected.clear();
        seats.forEach(s => s.el.classList.remove('selected'));
      }
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  /* ================================================================
   *  手动建组模式
   * ================================================================ */

  function toggleManualSelect(seat) {
    if (manualSelected.has(seat.id)) {
      manualSelected.delete(seat.id);
      seat.el.classList.remove('selected');
    } else {
      manualSelected.add(seat.id);
      seat.el.classList.add('selected');
    }
  }

  function startManualGrouping() {
    manualGrouping = true;
    manualSelected.clear();
    seats.forEach(s => s.el.classList.remove('selected'));
    manualGroupBtn.classList.add('active');
    manualGroupBtn.textContent = '选择中…';
    manualActions.style.display = 'flex';
  }

  function endManualGrouping() {
    manualGrouping = false;
    manualSelected.clear();
    seats.forEach(s => s.el.classList.remove('selected'));
    manualGroupBtn.classList.remove('active');
    manualGroupBtn.textContent = '手动建组';
    manualActions.style.display = 'none';
  }

  manualGroupBtn.addEventListener('click', () => {
    if (manualGrouping) {
      endManualGrouping();
    } else {
      startManualGrouping();
    }
  });

  finishBtn.addEventListener('click', () => {
    const sel = seats.filter(s => manualSelected.has(s.id));
    if (sel.length) createGroupFromSeats(sel);
    endManualGrouping();
  });

  cancelBtn.addEventListener('click', endManualGrouping);

  /* ================================================================
   *  网格对齐开关
   * ================================================================ */

  function setGridAlign(on) {
    gridAlign = on;
    gridSwitch.classList.toggle('on', on);
    canvas.classList.toggle('grid-bg', on);

    if (on) {
      seats.forEach(s => { s.col = null; s.row = null; });
      seats.forEach(s => {
        const cell = findFreeCell(s.x, s.y, s);
        if (cell) {
          s.col = cell.col;
          s.row = cell.row;
          s.x = s.col * CELL + PAD;
          s.y = s.row * CELL + PAD;
          moveSeatEl(s);
        }
      });
      renderGroups();
    } else {
      seats.forEach(s => { s.col = null; s.row = null; });
    }
  }

  gridSwitchWrap.addEventListener('click', () => {
    setGridAlign(!gridAlign);
  });

  /* ================================================================
   *  窗口尺寸变化
   * ================================================================ */

  window.addEventListener('resize', () => {
    applyTransform();
  });

  /* ================================================================
   *  初始化
   * ================================================================ */

  setGridAlign(true);
  applyTransform();
  updateEmpty();

})();
</script>
</body>
</html>
