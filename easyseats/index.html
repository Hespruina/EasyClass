    return true;
  }

  /* ================================================================
   *  排座算法
   * ================================================================ */

  // 先上后下、先左后右（同一排内按 x 排序）
  function sortSeatsByPosition(list) {
    return [...list].sort((a, b) => {
      const dy = a.y - b.y;
      if (Math.abs(dy) > 1) return dy;
      return a.x - b.x;
    });
  }

  function shuffled(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function applyAssignment(pairs) {
    nameBySeatId = new Map();
    pairs.forEach(([sid, name]) => {
      if (name) nameBySeatId.set(sid, name);
    });
    seats.forEach(paintSeat);
    updateSeatCountHint();
  }

  // 全班随机：所有名字打乱后按座位视觉顺序（上→下、左→右）依次落座
  function arrangeWholeClass() {
    const names = shuffled(listItems.map(i => i.name));
    const ordered = sortSeatsByPosition(seats);
    applyAssignment(ordered.map((s, i) => [s.id, names[i] || '']));
  }

  // 组 → 座位分桶（「未分组」的座位单独一桶）。
  // 桶的先后按「组内最靠前的座位」决定，保证分配顺序与视觉顺序一致。
  function seatGroupBuckets() {
    const buckets = [];
    groups.forEach(g => {
      const members = sortSeatsByPosition(seats.filter(s => s.groupId === g.id));
      if (members.length) buckets.push({ name: g.name, seats: members });
    });
    const rest = sortSeatsByPosition(seats.filter(s => !s.groupId || !groups.some(g => g.id === s.groupId)));
    if (rest.length) buckets.push({ name: '未分组', seats: rest });

    buckets.sort((a, b) => {
      const ka = a.seats[0], kb = b.seats[0];
      const dy = ka.y - kb.y;
      if (Math.abs(dy) > 1) return dy;
      return ka.x - kb.x;
    });
    return buckets;
  }

  // 组内随机排座：**学生不跨组**。
  // 每个组当前坐着的人，只在本组座位之间打乱重排；组框与组内座位划分完全不动。
  // 组内空位（新加进名单的人、之前被清空的座位）从「名单里还没排到座位的人」轮转补齐，
  // 轮转是为了不偏向任何一个组（否则前面的组会先把人吃光）。
  function arrangeWithinGroups() {
    const buckets = seatGroupBuckets();
    const listed = new Set(listItems.map(i => i.name));

    // 1) 每个组「当前坐着的人」，顺带统计每个名字已被占用的份数
    //    （同名同姓按份数算，避免两个「张伟」被当成一个人）
    const usedCount = new Map();
    buckets.forEach(b => {
      b.names = [];
      b.seats.forEach(s => {
        const n = nameBySeatId.get(s.id);
        if (!n || !listed.has(n)) return;          // 已被移出名单的旧名字丢弃
        b.names.push(n);
        usedCount.set(n, (usedCount.get(n) || 0) + 1);
      });
    });

    // 2) 名单里有、但没排到座位的名字（按份数扣减）
    const wantCount = new Map();
    listItems.forEach(i => wantCount.set(i.name, (wantCount.get(i.name) || 0) + 1));
    const leftovers = [];
    wantCount.forEach((want, name) => {
      const used = usedCount.get(name) || 0;
      for (let k = used; k < want; k++) leftovers.push(name);
    });
    const pool = shuffled(leftovers);

    let cursor = 0;
    let progressed = true;
    while (cursor < pool.length && progressed) {
      progressed = false;
      for (const b of buckets) {
        if (cursor >= pool.length) break;
        if (b.names.length < b.seats.length) { b.names.push(pool[cursor++]); progressed = true; }
      }
    }
    const unplaced = pool.length - cursor;   // 座位不够时的剩余人数（正常不会出现）

    // 3) 组内打乱后落座
    const pairs = [];
    buckets.forEach(b => {
      const inner = shuffled(b.names);
      b.seats.forEach((s, i) => pairs.push([s.id, inner[i] || '']));
    });
    applyAssignment(pairs);
    return { groupCount: buckets.length, unplaced };
  }

  // 统一的排座结果上传：提交期间在底部提示区显示「转圈 + 正在保存修改…」
  async function saveArrangement(doneMsg) {
    if (!cloudLoaded || !chart) { toast('请先选择一个已就绪的座位表', true); return false; }
    busyToast('正在保存修改…');
    try {
      await apiPost('/seat-charts/' + chart.chart_id + '/arrangement', { arrangement: collectArrangement() });
      toast(doneMsg || '已保存到云端');
      updateSeatCountHint();
      return true;
    } catch (err) {
      toast(err.message || '排座结果保存失败', true);
      return false;
    }
  }

  // 排座后自动保存最新结果到云端
  async function arrangeAndSave(kind) {
    if (!cloudLoaded || !chart) { toast('请先选择一个已就绪的座位表', true); return; }
    if (!listItems.length) { toast('绑定的名单里还没有学生', true); return; }

    if (kind === 'group') {
      if (!groups.length) { toast('这个座位表还没有小组，无法组内随机排座', true); return; }
      const r = arrangeWithinGroups();
      await saveArrangement('组内随机排座完成，已保存到云端'
        + (r.unplaced ? '（有 ' + r.unplaced + ' 人没排上，座位不足）' : ''));
    } else {
      arrangeWholeClass();
      await saveArrangement('全班随机排座完成，已保存到云端');
    }
  }

  arrangeBtn.addEventListener('click', () => {
    const r = arrangeBtn.getBoundingClientRect();
    showMenu(r.left, r.bottom + 6, [
      { label: '全班随机排座', onClick: () => arrangeAndSave('all') },
      { label: '组内随机排座', onClick: () => arrangeAndSave('group') },
      { label: '共 ' + seats.length + ' 个座位 / ' + listItems.length + ' 人', note: true }
    ]);
  });

  /* ================================================================
   *  手动排座（仅排座模式）
   *  点座位 →「手动选择名字」/「与其他同学换座」/「移出座位」
   *  每次改动立即保存到云端（提交期间底部提示区显示转圈）
   * ================================================================ */

  function seatNameOf(seat) { return nameBySeatId.get(seat.id) || ''; }

  function setPickedSeat(seat) {
    if (pickedSeat && pickedSeat !== seat) pickedSeat.el.classList.remove('picked');
    pickedSeat = seat || null;
    if (pickedSeat) pickedSeat.el.classList.add('picked');
  }

  function clearSwapHint() {
    seats.forEach(s => s.el.classList.remove('swap-target'));
  }

  // 名单里还没排到座位的同学。按「份数」扣减，两个同名的同学不会被互相顶掉。
  function unseatedNames() {
    const left = new Map();
    nameBySeatId.forEach(n => { if (n) left.set(n, (left.get(n) || 0) + 1); });
    const out = [];
    listItems.forEach(i => {
      const c = left.get(i.name) || 0;
      if (c > 0) left.set(i.name, c - 1);
      else out.push(i.name);
    });
    return out;
  }

  function flashMoved(list) {
    list.forEach(s => {
      s.el.classList.remove('just-moved');
      void s.el.offsetWidth;                 // 强制重排，让动画能重复触发
      s.el.classList.add('just-moved');
      setTimeout(() => s.el.classList.remove('just-moved'), 520);
    });
  }

  /* ---------- 换座飞行动画 ---------- */
  // 克隆座位块 → 按屏幕坐标走弧线 → 真实座位在飞行期间隐藏，落地后再改数据
  // 飞行期间 seatFlying = true：这段时间不接受新的换座 / 拖拽，避免动画叠在一起
  async function animateSeatFlight(flights) {
    const usable = flights.filter(f => f.from && f.to && f.from.el.getBoundingClientRect().width > 0);
    if (!usable.length) return;

    seatFlying = true;
    try {
      await runSeatFlight(usable);
    } finally {
      seatFlying = false;
    }
  }

  async function runSeatFlight(usable) {
    const DUR = 460;
    const ghosts = [];
    usable.forEach(f => {
      const r = f.from.el.getBoundingClientRect();
      const tr = f.to.el.getBoundingClientRect();
      const k = r.width / SEAT;                       // 当前画布缩放比
      const dx = tr.left - r.left;
      const dy = tr.top - r.top;
      const lift = f.lift === undefined ? -22 : f.lift;

      const g = f.from.el.cloneNode(true);
      g.classList.add('seat-flight');
      g.classList.remove('picked', 'swap-target', 'just-moved', 'hl', 'selected', 'drag-source', 'drop-target');
      g.textContent = f.name;
      g.style.left = r.left + 'px';
      g.style.top  = r.top + 'px';
      document.body.appendChild(g);
      ghosts.push(g);

      g.animate([
        { transform: 'translate(0px, 0px) scale(' + k + ')' },
        { transform: 'translate(' + (dx / 2) + 'px, ' + (dy / 2 + lift) + 'px) scale(' + k + ')' },
        { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + k + ')' }
      ], { duration: DUR, easing: 'cubic-bezier(.42,.02,.36,1)', fill: 'forwards' });
    });

    // 只把原名藏起来，座位格子留在原地 —— 飞的是「名字」，不是座位本身。
    // （整块 visibility:hidden 会在网格上留出空洞，看着像座位丢了）
    usable.forEach(f => { f.from.el.style.color = 'transparent'; });
    await new Promise(r => setTimeout(r, DUR + 30));
    ghosts.forEach(g => g.remove());
    usable.forEach(f => { f.from.el.style.color = ''; });
  }

  /* ---------- 选人面板 ---------- */
  let npCurrent = [];   // 面板里当前渲染出的名单（点击按 idx 取名字，避开属性里的引号问题）

  function renderNamePicker() {
    if (!pickerSeat) return;
    const names = unseatedNames();
    const kw = (npSearch.value || '').trim();
    const shown = kw ? names.filter(n => n.indexOf(kw) >= 0) : names;
    npCurrent = shown;

    npSub.textContent = '还没排座：' + names.length + ' 人'
      + (kw ? '（筛出 ' + shown.length + ' 人）' : '');

    if (!names.length) {
      npCurrent = [];
      npBody.innerHTML = '<div class="np-empty">全班同学都已经排到座位上。<br>'
        + '想换人请点座位选「与其他同学换座」。</div>';
      return;
    }
    if (!shown.length) {
      npCurrent = [];
      npBody.innerHTML = '<div class="np-empty">没有匹配「' + escapeHtml(kw) + '」的同学</div>';
      return;
    }
    npBody.innerHTML = shown.map((n, i) =>
      '<div class="np-item" data-idx="' + i + '">' + escapeHtml(n) + '</div>').join('');
  }

  function openNamePicker(seat) {
    closeGroupPanel();          // 两个面板都在右侧，避免叠在一起
    pickerSeat = seat;
    npTitle.textContent = '为座位选一个同学';
    npSearch.value = '';
    renderNamePicker();
    namePicker.classList.add('show');
  }

  function closeNamePicker() {
    namePicker.classList.remove('show');
    pickerSeat = null;
  }

  npBody.addEventListener('click', e => {
    const item = e.target && e.target.closest ? e.target.closest('.np-item') : null;
    if (!item || !pickerSeat) return;
    const seat = pickerSeat;
    const name = npCurrent[parseInt(item.dataset.idx, 10)];
    closeNamePicker();
    if (name) assignNameToSeat(seat, name);
  });
  npSearch.addEventListener('input', renderNamePicker);
  namePickerClose.addEventListener('click', closeNamePicker);

  /* ---------- 落座 / 换座 ---------- */
  // 把某个名字放到某个座位上；该座位原本的同学自然回到「未排座」池
  async function assignNameToSeat(seat, name) {
    if (seatFlying) return;
    if (seatNameOf(seat) === name) { toast('这位同学就坐在这个座位上'); return; }

    if (name) nameBySeatId.set(seat.id, name);
    else nameBySeatId.delete(seat.id);
    paintSeat(seat);
    flashMoved([seat]);
    updateSeatCountHint();   // 先刷计数，保存失败也不会和画布对不上

    if (name) await saveArrangement('已把 ' + name + ' 安排到这个座位');
    else await saveArrangement('已把这位同学移出座位');
  }

  function startSwap(seat) {
    swapSourceSeat = seat;
    clearSwapHint();
    setPickedSeat(seat);
    closeMenu();
    seats.forEach(s => { if (seatNameOf(s)) s.el.classList.add('swap-target'); });
    toast('请点击另一位同学的座位完成换座');
  }

  function cancelSwap(silent) {
    if (!swapSourceSeat) return;
    swapSourceSeat = null;
    clearSwapHint();
    setPickedSeat(null);
    if (!silent) toast('已取消换座');
  }

  async function finishSwap(target) {
    const from = swapSourceSeat;
    if (!from || seatFlying) return;
    if (target.id === from.id) { cancelSwap(); return; }

    const nameA = seatNameOf(from);
    const nameB = seatNameOf(target);

    clearSwapHint();
    swapSourceSeat = null;
    setPickedSeat(null);

    if (!nameA) { toast('这个座位还没有同学', true); return; }

    // 目标空座：直接把同学搬过去（同样是「换座」操作，只是另一边没人）
    if (!nameB) {
      await animateSeatFlight([{ from, to: target, name: nameA, lift: -24 }]);
      nameBySeatId.delete(from.id);
      nameBySeatId.set(target.id, nameA);
      paintSeat(from); paintSeat(target);
      flashMoved([target]);
      updateSeatCountHint();
      await saveArrangement('已把 ' + nameA + ' 移到空座位');
      return;
    }

    // 两个名字沿弧线交叉飞过，一上一下，视觉上分得开
    await animateSeatFlight([
      { from, to: target, name: nameA, lift: -26 },
      { from: target, to: from, name: nameB, lift: 26 }
    ]);
    nameBySeatId.set(from.id, nameB);
    nameBySeatId.set(target.id, nameA);
    paintSeat(from); paintSeat(target);
    flashMoved([from, target]);
    updateSeatCountHint();
    await saveArrangement('已交换 ' + nameA + ' 与 ' + nameB);
  }

  /* ---------- 拖动学生换座（排座模式） ----------
   * 排座位下按住一个有人的座位拖到另一个座位松手：
   *   目标有人 → 两人互换；目标空座 → 直接搬过去（「空座」是允许空座模式下的常态）
   * 只拖「名字」，座位格局不动；拖到空白处松手 = 取消。
   * 状态放在 dragSwap 里，鼠标与触屏共用同一套。
   * ------------------------------------------------------------ */
  let dragSwap = null;   // { from, ghost, target }

  // 光标下的座位：用世界坐标算，不走 getBoundingClientRect（拖动时每帧都查，避免反复触发重排）
  function seatAtPoint(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const wx = (cx - r.left - offsetX) / scale;
    const wy = (cy - r.top  - offsetY) / scale;
    for (let i = seats.length - 1; i >= 0; i--) {
      const s = seats[i];
      if (wx >= s.x && wx <= s.x + SEAT && wy >= s.y && wy <= s.y + SEAT) return s;
    }
    return null;
  }

  function moveDragGhost(cx, cy) {
    if (!dragSwap || !dragSwap.ghost) return;
    dragSwap.ghost.style.left = cx + 'px';
    dragSwap.ghost.style.top  = cy + 'px';
  }

  // 能不能从这个座位拖起来：有名字、没有正在飞的动画、没有已待定的换座
  function canDragSeat(seat) {
    return !!seat && manualSeating && !seatFlying && !swapSourceSeat && !!seatNameOf(seat);
  }

  // 拆掉拖动中的视觉（影子 / 源座位虚线 / 落点高亮），返回被拆掉的拖动状态
  function resetDragDom() {
    if (!dragSwap) return null;
    const d = dragSwap;
    dragSwap = null;
    document.body.classList.remove('dragging-seat');
    if (d.from) d.from.el.classList.remove('drag-source');
    if (d.ghost) d.ghost.remove();
    if (d.target) d.target.el.classList.remove('drop-target');
    return d;
  }

  function beginSeatDrag(seat, cx, cy) {
    if (!canDragSeat(seat)) return false;
    resetDragDom();          // 兜底：上一次松手落在窗口外没收到 mouseup
    cancelSwap(true);
    closeMenu();
    closeNamePicker();
    setPickedSeat(seat);

    const g = document.createElement('div');
    g.className = 'seat-drag-ghost';
    g.textContent = seatNameOf(seat);
    // 跟随画布缩放：影子和屏幕上的座位一样大
    const k = clamp(scale, 0.6, 2);
    g.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
    document.body.appendChild(g);

    dragSwap = { from: seat, ghost: g, target: null };
    seat.el.classList.add('drag-source');
    document.body.classList.add('dragging-seat');
    moveDragGhost(cx, cy);
    return true;
  }

  function updateSeatDrag(cx, cy) {
    if (!dragSwap) return;
    moveDragGhost(cx, cy);
    const over = seatAtPoint(cx, cy);
    const target = (over && over !== dragSwap.from) ? over : null;
    if (target === dragSwap.target) return;
    if (dragSwap.target) dragSwap.target.el.classList.remove('drop-target');
    dragSwap.target = target;
    if (target) target.el.classList.add('drop-target');
  }

  async function endSeatDrag(commit) {
    const d = resetDragDom();
    if (!d) return;
    setPickedSeat(null);

    if (!commit) return;
    if (!d.target) { toast('拖到另一个座位上松手才能换座'); return; }

    swapSourceSeat = d.from;      // 复用现有换座逻辑（目标为空座时走「移过去」分支）
    await finishSwap(d.target);
  }

  // 单击某个座位：换座中 → 完成换座；否则弹出该座位的操作菜单
  function onSeatTap(seat) {
    if (seatFlying) return;
    if (swapSourceSeat) { finishSwap(seat); return; }

    closeNamePicker();
    const name = seatNameOf(seat);
    const r = seat.el.getBoundingClientRect();

    const items = [{ label: '手动选择名字', onClick: () => openNamePicker(seat) }];
    if (name) {
      items.push({ label: '与其他同学换座', onClick: () => startSwap(seat) });
      items.push({ label: '移出座位', danger: true, onClick: () => assignNameToSeat(seat, '') });
    }
    items.push({ label: '当前：' + (name || '空座'), note: true });

    setPickedSeat(seat);
    closeMenu();
    showMenu(r.left, r.bottom + 6, items);
  }

  /* ---------- 一键清空所有名字 ---------- */
  async function clearAllNames() {
    const seated = seats.filter(s => seatNameOf(s)).length;
    if (!seated) { toast('现在没有任何已排座的名字', true); return; }
    if (!window.confirm('确定要清空全部 ' + seated + ' 个座位上的名字吗？\n（清空结果会立即保存到云端）')) return;

    cancelSwap(true);
    closeNamePicker();
    closeMenu();
    setPickedSeat(null);
    nameBySeatId = new Map();
    seats.forEach(paintSeat);
    updateSeatCountHint();
    await saveArrangement('已清空所有名字');
  }

  /* ================================================================
   *  导出 A4 座位表图片（手动排座模式）
   *  纯 Canvas 绘制，不依赖任何外部库：
   *    · 纯白背景 + 浅灰描边座位 + 深色姓名，打印 / 投屏都清晰
   *    · 按 A4 纸张比例（210×297mm）出图，根据座位整体形状自动选横版 / 竖版
   *    · 内容整体居中缩放，姓名自动折行缩放字号
   * ================================================================ */

  const A4_SHORT = 1240;                                  // A4 短边像素（≈150dpi）
  const A4_LONG  = Math.round(A4_SHORT * 297 / 210);      // A4 长边像素
  const EXPORT_FONT = '"Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif';

  // 圆角矩形路径（兼容不支持 ctx.roundRect 的浏览器）
  function roundRectPath(ctx, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y,     x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x,     y + h, rr);
    ctx.arcTo(x,     y + h, x,     y,     rr);
    ctx.arcTo(x,     y,     x + w, y,     rr);
    ctx.closePath();
  }

  // 在座位方块里绘制姓名：按宽度折行，放不下就逐步缩字号
  function drawSeatName(ctx, text, cx, cy, boxW, boxH) {
    const maxW = boxW * 0.84;
    const maxH = boxH * 0.84;

    let fs = Math.max(6, boxW * 0.26);
    let lines = [text];

    for (;;) {
      const perLine = Math.max(1, Math.floor(maxW / (fs * 1.04)));
      lines = [];
      for (let i = 0; i < text.length; i += perLine) {
        lines.push(text.slice(i, i + perLine));
      }
      if (lines.length * fs * 1.16 <= maxH + 0.5 || fs <= 6) break;
      fs *= 0.9;
    }

    const lineH = fs * 1.16;
    const startY = cy - (lines.length * lineH) / 2 + lineH / 2;

    ctx.save();
    ctx.font = '600 ' + fs.toFixed(2) + 'px ' + EXPORT_FONT;
    ctx.fillStyle = '#1b1f24';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lineH));
    ctx.restore();
  }

  // 计算某个纸张方向下的版面参数与缩放比
  function exportMetrics(portrait, bw, bh) {
    const W = portrait ? A4_SHORT : A4_LONG;
    const H = portrait ? A4_LONG  : A4_SHORT;

    const margin = Math.round(W * 0.055);           // 页面四周留白
    const titleH = Math.round(Math.min(H * 0.11, 150)); // 顶部标题区高度

    const contentX = margin;
    const contentY = margin + titleH;
    const contentW = W - margin * 2;
    const contentH = H - contentY - margin;

    const PAD = 30;                                  // 内容与版心边界的最小间距
    let k = Math.min((contentW - PAD * 2) / bw, (contentH - PAD * 2) / bh);
    k = clamp(k, 0.15, 3.2);

    return { W, H, margin, titleH, contentX, contentY, contentW, contentH, k };
  }

  // 把当前座位表画到一张离屏 canvas 上，返回该 canvas
  function renderSeatChartCanvas() {
    // ---- 1. 座位整体包围盒 ----
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    seats.forEach(s => {
      minX = Math.min(minX, s.x);
      minY = Math.min(minY, s.y);
      maxX = Math.max(maxX, s.x + SEAT);
      maxY = Math.max(maxY, s.y + SEAT);
    });
    const bw = Math.max(1, maxX - minX);
    const bh = Math.max(1, maxY - minY);

    // ---- 2. 选 A4 横版 / 竖版：内容明显横向铺开时用横版，否则竖版 ----
    const landscape = bw > bh * 1.25;
    const M = exportMetrics(!landscape, bw, bh);

    const cv = document.createElement('canvas');
    cv.width = M.W;
    cv.height = M.H;
    const ctx = cv.getContext('2d');

    // 纯白底
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, M.W, M.H);

    // ---- 3. 坐标换算（内容在版心内居中） ----
    const drawW = bw * M.k;
    const drawH = bh * M.k;
    const originX = M.contentX + (M.contentW - drawW) / 2 - minX * M.k;
    const originY = M.contentY + (M.contentH - drawH) / 2 - minY * M.k;
    const tx = x => originX + x * M.k;
    const ty = y => originY + y * M.k;
    const seatSize = SEAT * M.k;

    // ---- 4. 小组虚线框（画在座位下层，浅色不抢眼） ----
    groups.forEach(g => {
      const members = seats.filter(s => s.groupId === g.id);
      if (!members.length) return;

      let gx1 = Infinity, gy1 = Infinity, gx2 = -Infinity, gy2 = -Infinity;
      members.forEach(s => {
        gx1 = Math.min(gx1, tx(s.x));
        gy1 = Math.min(gy1, ty(s.y));
        gx2 = Math.max(gx2, tx(s.x) + seatSize);
        gy2 = Math.max(gy2, ty(s.y) + seatSize);
      });

      const p = Math.max(5, seatSize * 0.16);
      const x = gx1 - p, y = gy1 - p, w = gx2 - gx1 + p * 2, h = gy2 - gy1 + p * 2;

      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = g.color;
      ctx.lineWidth = Math.max(1.5, seatSize * 0.028);
      ctx.setLineDash([Math.max(5, seatSize * 0.13), Math.max(4, seatSize * 0.09)]);
      roundRectPath(ctx, x, y, w, h, Math.max(6, seatSize * 0.14));
      ctx.stroke();
      ctx.restore();

      // 组名标签：贴在框的左上角
      const fs = Math.max(10, seatSize * 0.2);
      ctx.save();
      ctx.font = '600 ' + fs.toFixed(2) + 'px ' + EXPORT_FONT;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(g.name).width;
      const lw = tw + fs * 1.3;
      const lh = fs * 1.75;
      ctx.fillStyle = g.color;
      roundRectPath(ctx, x, y - lh / 2, lw, lh, lh / 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(g.name, x + fs * 0.65, y + 1);
      ctx.restore();
    });

    // ---- 5. 座位与姓名 ----
    const radius = Math.max(3, seatSize * 0.12);

    seats.forEach(s => {
      const x = tx(s.x), y = ty(s.y);
      const name = nameBySeatId.get(s.id) || '';

      ctx.save();
      roundRectPath(ctx, x, y, seatSize, seatSize, radius);
      if (name) {
        // 有人的座位：白底 + 实线描边
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = Math.max(1.2, seatSize * 0.028);
        ctx.strokeStyle = '#c3c8d0';
        ctx.stroke();
      } else {
        // 空座：极浅灰底 + 虚线描边
        ctx.fillStyle = '#f6f7f9';
        ctx.fill();
        ctx.lineWidth = Math.max(1, seatSize * 0.022);
        ctx.strokeStyle = '#e4e7ec';
        ctx.setLineDash([Math.max(4, seatSize * 0.08), Math.max(3, seatSize * 0.06)]);
        ctx.stroke();
      }
      ctx.restore();

      if (name) {
        drawSeatName(ctx, name, x + seatSize / 2, y + seatSize / 2, seatSize, seatSize);
      } else {
        // 空座中央一条短横线
        const half = seatSize * 0.13;
        ctx.save();
        ctx.strokeStyle = '#d8dce2';
        ctx.lineWidth = Math.max(1.4, seatSize * 0.035);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + seatSize / 2 - half, y + seatSize / 2);
        ctx.lineTo(x + seatSize / 2 + half, y + seatSize / 2);
        ctx.stroke();
        ctx.restore();
      }
    });

    // ---- 6. 页眉标题 / 页脚 ----
    const title = (chart && chart.name) ? chart.name : '座位表';
    const now = new Date();
    const arranged = seats.filter(s => nameBySeatId.get(s.id)).length;
    const emptyCount = seats.length - arranged;
    const subtitle = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日'
      + ' · 共 ' + seats.length + ' 个座位 · 已排座 ' + arranged + ' 人'
      + (emptyCount > 0 ? ' · 空座 ' + emptyCount + ' 个' : '');

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const tSize = Math.max(26, Math.min(44, M.W * 0.03));
    ctx.fillStyle = '#15181c';
    ctx.font = '600 ' + tSize.toFixed(2) + 'px ' + EXPORT_FONT;
    ctx.fillText(title, M.W / 2, M.margin + tSize * 0.85, M.W - M.margin * 2);

    const sSize = Math.max(16, Math.min(23, M.W * 0.016));
    ctx.fillStyle = '#8d939c';
    ctx.font = '400 ' + sSize.toFixed(2) + 'px ' + EXPORT_FONT;
    ctx.fillText(subtitle, M.W / 2, M.margin + tSize * 0.85 + sSize * 2.1, M.W - M.margin * 2);

    // 标题下的细分割线
    ctx.strokeStyle = '#edeff2';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(M.margin, M.contentY - 16);
    ctx.lineTo(M.W - M.margin, M.contentY - 16);
    ctx.stroke();

    // 页脚
    ctx.fillStyle = '#c9ced5';
    ctx.font = '400 17px ' + EXPORT_FONT;
    ctx.fillText('易排座 · easyclass.zhrhello.top', M.W / 2, M.H - M.margin * 0.55);
    ctx.restore();

    return cv;
  }

  function safeFileName(name) {
    return String(name).replace(/[\\/:*?"<>|\r\n\t]+/g, '_').slice(0, 80);
  }

  async function exportSeatImage() {
    if (!seats.length) { toast('当前没有座位可以导出', true); return; }
    if (seatFlying) { toast('正在换座动画中，请稍后再导出', true); return; }

    const oldLabel = exportBtn.innerHTML;
    exportBtn.disabled = true;
    exportBtn.textContent = '生成中…';

    try {
      // 等中文字体就绪（最多等 800ms），否则可能用默认字体绘制
      await Promise.race([
        (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve(),
        new Promise(r => setTimeout(r, 800))
      ]);

      const cv = renderSeatChartCanvas();
      const blob = await new Promise(resolve => cv.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('图片生成失败，请重试');

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = safeFileName(((chart && chart.name) ? chart.name : '座位表') + '-座位表.png');
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      toast('已导出 A4 座位表图片');
    } catch (err) {
      toast((err && err.message) ? err.message : '导出失败，请重试', true);
    } finally {
      exportBtn.disabled = false;
      exportBtn.innerHTML = oldLabel;
    }
  }

  /* ================================================================
   *  模式：排座位 ⇄ 格局编辑
   *  · 进「排座位」= 直接就是手动排座（点座位选名字 / 换座），不用再点一次开关
   *  · 「格局编辑」负责摆座位、分组、吸附，两者用顶部选项卡切换
   * ================================================================ */

  let savedLayoutSignature = '';   // 已加载 / 已保存的格局指纹，用来判断有没有未保存的改动
  let bootToastShown = false;      // 「已进入手动排座」只提示一次

  // 格局指纹：只比座位、分组、吸附，不含缩放平移（否则拖一下画布就算被改过）
  function layoutSignature() {
    const l = collectLayout();
    return JSON.stringify({ g: l.gridAlign, gr: l.groups, s: l.seats });
  }

  function markLayoutSaved() { savedLayoutSignature = layoutSignature(); }

  function layoutDirty() { return layoutSignature() !== savedLayoutSignature; }

  // 切模式时保留已排好的姓名（座位 id 来自 layout，映射关系不变）
  function reapplyKeepNames(layout) {
    const keepNames = nameBySeatId;
    applyLayout(layout);
    nameBySeatId = keepNames;
    seats.forEach(paintSeat);
    updateSeatCountHint();
  }

  // 收起排座态的临时选中态 / 菜单 / 选人面板
  function clearSeatingSelection() {
    if (dragSwap) endSeatDrag(false);   // 拖动中途被打断（切模式 / 换表）：影子要收掉
    cancelSwap(true);
    clearSwapHint();
    closeNamePicker();
    closeMenu();
    setPickedSeat(null);
  }

  // 选项卡可用状态：座位坐得下名单人数才允许排座（允许空座时座位可以多于人数）
  function syncTabState() {
    const hasChart = !!chart;
    tabLayout.disabled = !hasChart;
    tabSeat.disabled = !hasChart || !listItems.length || !seatsFit(seats.length, listItems.length);
  }

  // 刷新 / 分享时停在同一个选项卡
  function syncUrlMode() {
    const url = new URL(window.location.href);
    if (editMode) url.searchParams.set('mode', 'edit_cloud_seats_set');
    else url.searchParams.delete('mode');
    history.replaceState(null, '', url.toString());
  }

  // 返回 false 表示这次切换没做成（界面已复位到原模式）
  function switchMode(nextEdit, opts) {
    const silent = !!(opts && opts.silent);
    if (!!nextEdit === editMode) { applyModeUI(); return true; }

    if (nextEdit) {
      // ---- 切到格局编辑 ----
      clearSeatingSelection();
      closeGroupPanel();
      editMode = true;

      if (!chart) { applyModeUI(); return true; }

      // 格局还没设定 / 人数不一致也要能进来摆座位，不能把人拦在提示页
      reapplyKeepNames(chart.has_layout ? chart.layout : null);
      hideNotice();
      cloudLoaded = true;
      applyModeUI();
      syncUrlMode();

      if (!chart.has_layout) {
        toast('请摆放' + (allowEmptySeats() ? '至少 ' : '正好 ') + listItems.length
              + ' 个座位，点「保存格局」后即可排座');
      } else if (!seatsFit(seats.length, listItems.length)) {
        toast('座位 ' + seats.length + ' / 名单 ' + listItems.length + '，'
              + (allowEmptySeats() ? '座位不够，需要补座位' : '该表设为「仅满座」，数量必须一致'), true);
      } else if (!silent) {
        toast('已进入格局编辑：拖动座位调整位置，改完点「保存格局」');
      }
      return true;
    }

    // ---- 切到排座位 ----
    if (!chart) { toast('请先选择一个座位表', true); applyModeUI(); return false; }
    if (!listItems.length) { toast('这个座位表绑定的名单里还没有学生', true); applyModeUI(); return false; }
    if (!seats.length || !seatsFit(seats.length, listItems.length)) {
      toast('座位 ' + seats.length + ' / 名单 ' + listItems.length + '，'
            + (allowEmptySeats() ? '座位不够，先去「格局编辑」补座位'
                                 : '该表设为「仅满座」，先去「格局编辑」调成一致'), true);
      applyModeUI();
      return false;
    }
    if (layoutDirty()) {
      const ok = window.confirm('格局还有未保存的改动。\n\n切到「排座位」会丢弃这些改动，要保留请先点「保存格局」。\n\n确定继续吗？');
      if (!ok) { applyModeUI(); return false; }
      reapplyKeepNames(chart.layout);
    }

    if (manualGrouping) endManualGrouping();
    clearSeatingSelection();
    editMode = false;
    hideNotice();
    cloudLoaded = true;
    applyModeUI();
    syncUrlMode();
    if (!silent) toast('已切到手动排座：点座位可以选名字，或与同学换座');
    return true;
  }

  tabSeat.addEventListener('click', () => { if (!tabSeat.disabled) switchMode(false); });
  tabLayout.addEventListener('click', () => { if (!tabLayout.disabled) switchMode(true); });

  clearNamesBtn.addEventListener('click', clearAllNames);
  exportBtn.addEventListener('click', exportSeatImage);

  reloadBtn.addEventListener('click', () => {
    if (chart) reloadChart(chart.chart_id);
    else boot();
  });

  chartSelect.addEventListener('change', () => {
    const id = parseInt(chartSelect.value, 10);
    if (id) reloadChart(id);
  });

  function reloadChart(chartId) {
    chart = null;
    cloudLoaded = false;
    return loadChart(chartId);
  }

  /* ================================================================
   *  格局编辑：保存（留在原地，方便直接切去排座位）
   * ================================================================ */

  saveBtn.addEventListener('click', async () => {
    if (!chart) { toast('没有可保存的座位表', true); return; }
    if (!seatsFit(seats.length, listItems.length)) {
      toast(allowEmptySeats()
        ? '座位数量（' + seats.length + '）不能少于名单人数（' + listItems.length + '）'
        : '该座位表设为「仅满座」，座位数量（' + seats.length + '）必须等于名单人数（' + listItems.length + '）',
        true);
      return;
    }
    if (!seats.length) { toast('请先摆放座位', true); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';
    busyToast('正在保存格局…');
    try {
      const layout = collectLayout();
      await apiPost('/seat-charts/' + chart.chart_id + '/layout', { layout: layout });
      chart.layout = layout;
      chart.has_layout = true;
      chart.seat_count = seats.length;
      markLayoutSaved();
      toast(seatsFit(seats.length, listItems.length)
        ? '格局已保存，点顶部「排座位」就能开始排座'
        : '已保存');
    } catch (err) {
      toast(err.message || '保存失败，请重试', true);
      if (err.payload && err.payload.list_item_count !== undefined) {
        listItems = listItems.slice(0, err.payload.list_item_count);
      }
    } finally {
      saveBtn.innerHTML = SAVE_LABEL;
      updateSeatCountHint();
    }
  });

  /* ================================================================
   *  返回控制台：任何情况下都先保存一次再走
   *  · 格局编辑：把当前格局存回云端（不满足保存条件 / 保存失败时明确告知，由用户决定走不走）
   *  · 排座位：把当前排座结果再写一次（正常每次改动都已即时保存，这里只是兜底）
   * ================================================================ */

  let leavingForConsole = false;   // 防止连点 / 保存途中重复触发

  // 返回 true = 可以离开，false = 用户选择留下
  async function saveBeforeLeave() {
    if (!chart || !cloudLoaded) return true;   // 提示页 / 没加载成功：没有可保存的内容

    if (editMode) {
      if (!seats.length) return true;          // 空画布没有格局可存
      if (!seatsFit(seats.length, listItems.length)) {
        return window.confirm('当前格局不满足保存条件（座位 ' + seats.length
          + ' / 名单 ' + listItems.length + '），无法保存。\n\n仍要返回控制台吗？'
          + '未保存的格局改动会丢失。');
      }
      showLoading('正在保存格局…');
      try {
        const layout = collectLayout();
        await apiPost('/seat-charts/' + chart.chart_id + '/layout', { layout: layout });
        chart.layout = layout;
        chart.has_layout = true;
        chart.seat_count = seats.length;
        markLayoutSaved();
        return true;
      } catch (err) {
        hideLoading();
        return window.confirm('格局保存失败：' + ((err && err.message) || '网络异常')
          + '\n\n仍要返回控制台吗？未保存的格局改动会丢失。');
      }
    }

    showLoading('正在保存排座结果…');
    try {
      await apiPost('/seat-charts/' + chart.chart_id + '/arrangement',
                    { arrangement: collectArrangement() });
      return true;
    } catch (err) {
      hideLoading();
      return window.confirm('排座结果保存失败：' + ((err && err.message) || '网络异常')
        + '\n\n仍要返回控制台吗？');
    }
  }

  async function goConsole() {
    if (leavingForConsole) return;
    leavingForConsole = true;
    backBtn.disabled = true;
    let ok = true;
    try {
      ok = await saveBeforeLeave();
    } catch (err) {
      ok = window.confirm('离开前保存失败：' + ((err && err.message) || '未知错误')
        + '\n\n仍要返回控制台吗？');
    } finally {
      hideLoading();
      leavingForConsole = false;
      backBtn.disabled = false;
    }
    if (ok) window.location.href = CONSOLE_URL;
  }

  backBtn.addEventListener('click', goConsole);

  /* ================================================================
   *  模式初始化
   * ================================================================ */

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML.replace(/'/g, '&#39;');
  }

  // 当前模式的界面状态：选项卡、画布语义、状态栏提示
  function applyModeUI() {
    const isLayout = editMode;
    manualSeating = !isLayout;

    ribbon.dataset.mode = isLayout ? 'layout' : 'seat';
    tabSeat.classList.toggle('active', !isLayout);
    tabLayout.classList.toggle('active', isLayout);
    syncTabState();

    canvas.classList.toggle('view-mode', !isLayout);
    canvas.classList.toggle('pannable', !isLayout);
    canvas.classList.toggle('manual-seating', !isLayout);
    bottomBar.classList.toggle('view-mode', !isLayout);

    const hasChart = !!chart;
    reloadBtn.style.display = hasChart ? '' : 'none';
    backBtn.style.display = '';
    chartSelect.style.display = chartList.length ? '' : 'none';
    arrangeBtn.style.display = (!isLayout && hasChart) ? '' : 'none';
    seatCountHint.style.display = '';
    refreshAllowEmptyBtn();

    document.title = isLayout ? '易排座 · 格局编辑' : '易排座 · 手动排座';

    if (isLayout) {
      canvas.dataset.empty = '从「新座位」拖到画布，或点「一键铺座」按名单人数铺满';
      opHintMouse.innerHTML = '鼠标：<b>右键</b>空白 = 建座，<b>右键</b>座位 = 删除；<b>左键框选</b> = 建组 / 批量操作；<b>Ctrl+拖动</b> = 平移画布；<b>滚轮</b> = 缩放';
      opHintTouch.innerHTML = '触屏：单指拖座位 = 移动；空白单指拖 = 框选；双指拖动 = 平移，双指捏合 = 缩放';
      clearSeatingSelection();
    } else {
      canvas.dataset.empty = '该座位表还没有设定座位格局';
      opHintMouse.innerHTML = '鼠标：<b>点座位</b> = 选名字 / 换座；<b>拖动座位</b> = 互换（拖到空座 = 移过去）；拖动空白 = 平移；<b>滚轮</b> = 缩放';
      opHintTouch.innerHTML = '触屏：<b>轻点座位</b> = 选名字 / 换座；<b>单指拖座位</b> = 互换；单指拖空白 = 平移；双指捏合 = 缩放';
    }

    // 换模式必须重画所有座位文字：格局编辑态显示「座位」，排座态显示姓名 / 空座。
    // 少了这一句就会出现「切到格局编辑再切回来，座位上的名字全没了」的假象 ——
    // 数据一直在 nameBySeatId 里，只是文字没跟着模式刷新。
    seats.forEach(paintSeat);

    renderGroupPanel();   // 面板里的「改名 / 删除」按钮跟着模式走
    updateEmpty();
    updateSeatCountHint();
  }

  // 统一入口：拉座位表列表 → 加载 → 按 editMode 组装界面
  async function boot() {
    showLoading('加载座位表…');
    try {
      const pick = await loadChartList(initChartId);
      hideLoading();
      if (!pick) {
        chart = null;
        chartList = [];
        clearLayout();
        applyModeUI();
        showNotice('还没有座位表',
          '请先到 EasyCore 控制台的「座位表」页创建一个座位表（创建时要选择它使用的名单），'
          + '再点该座位表的「编辑」进来摆座位。', true, '返回控制台');
        return;
      }
      await loadChart(pick);
      applyModeUI();
      if (!editMode && cloudLoaded && !bootToastShown) {
        bootToastShown = true;
        toast('已在手动排座模式：点座位可以选择名字，或与其他同学换座');
      }
    } catch (err) {
      hideLoading();
      applyModeUI();
      showNotice('加载失败', escapeHtml(err.message || '请稍后重试'), false);
    }
  }

  noticeGoBtn.addEventListener('click', () => {
    hideNotice();
    if (chart) switchMode(true);                       // 有座位表：原地切到格局编辑
    else goConsole();                                  // 没有座位表：走同一条「先保存再返回」的出口
  });
  noticeReloadBtn.addEventListener('click', () => {
    hideNotice();
    if (chart) reloadChart(chart.chart_id);
    else boot();
  });

  /* ================================================================
   *  窗口尺寸变化
   * ================================================================ */

  window.addEventListener('resize', () => {
    applyTransform();
  });

  /* ================================================================
   *  初始化
   * ================================================================ */

  if (!editMode) {
    // 排座模式：空白处单指/拖动平移，需要抓手光标
    canvas.classList.add('view-mode', 'pannable');
  }
  setGridAlign(true);
  applyTransform();
  applyModeUI();
  updateEmpty();
  updateSeatCountHint();
  renderGroupPanel();

  boot();

})();
</script>
</body>
</html>
