<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>易排座 · 教室座位编排</title>
<meta name="description" content="易排座是免费的在线教室座位编排工具，支持自定义格局、小组划分、全班随机与组内随机排座，可手动微调并云端保存。">
<link rel="canonical" href="https://easyclass.zhrhello.top/easyseats/">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y9dascui0p");
</script>
<!-- CSS：按 tokens → 组件 → 窄屏适配 的顺序加载 -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ribbon.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/seat.css">
<link rel="stylesheet" href="css/statusbar.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/group-panel.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/manual-seating.css">
<link rel="stylesheet" href="css/loading.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="ribbon" data-mode="seat">
  <!-- ===== 选项卡 ===== -->
  <div class="rb-tabs">
    <span class="rb-brand">易排座</span>
    <button class="rb-tab active" id="tabSeat" type="button">排座位</button>
    <button class="rb-tab" id="tabLayout" type="button">格局编辑</button>

    <div class="rb-tabs-right">
      <span id="seatCountHint" class="tb-hint"></span>
      <select id="chartSelect" style="display:none"></select>
      <button id="reloadBtn" class="rb-icon-btn" type="button" style="display:none" title="重新加载当前座位表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11a8.5 8.5 0 1 0-2.4 6.1"/><path d="M20.5 4v7h-7"/></svg>
        <span>刷新</span>
      </button>
      <button id="backBtn" class="rb-icon-btn" type="button" style="display:none" title="返回 EasyCore 控制台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H12"/></svg>
        <span>返回控制台</span>
      </button>
    </div>
  </div>

  <!-- ===== 功能区 ===== -->
  <div class="rb-body">

    <!-- 排座 -->
    <div class="rb-group" data-mode="seat">
      <div class="rb-row">
        <button id="arrangeBtn" class="rb-btn big" type="button" style="display:none" title="全班随机 / 组内随机">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg></span>
          <span class="rb-txt">随机排座</span>
        </button>
        <button id="clearNamesBtn" class="rb-btn big" type="button" title="清空所有座位上的名字">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H5l-1.8-1.8a2 2 0 0 1 0-2.8l9.6-9.6a2 2 0 0 1 2.8 0l3.6 3.6a2 2 0 0 1 0 2.8L13 20"/><path d="M9 20h11"/><path d="m11 8.5 5.5 5.5"/></svg></span>
          <span class="rb-txt">清空名字</span>
        </button>
        <button id="exportBtn" class="rb-btn big" type="button" title="导出 A4 座位表图片">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
          <span class="rb-txt">导出图片</span>
        </button>
      </div>
      <div class="rb-label">排座</div>
    </div>

    <!-- 座位 -->
    <div class="rb-group" data-mode="layout">
      <div class="rb-row">
        <button id="seatSource" class="rb-btn big" type="button" title="按住拖到画布上，放一个新座位">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="11" height="11" rx="2"/><path d="M19 13v8"/><path d="M15 17h8"/></svg></span>
          <span class="rb-txt">新座位</span>
        </button>
        <button id="fillSeatsBtn" class="rb-btn big" type="button" title="按 6 列网格把座位补齐到名单人数">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></svg></span>
          <span class="rb-txt">一键铺座</span>
        </button>
      </div>
      <div class="rb-label">座位</div>
    </div>

    <!-- 小组 -->
    <div class="rb-group">
      <div class="rb-row">
        <button id="manualGroupBtn" class="rb-btn" data-mode="layout" type="button">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><path d="M17.5 14v7"/><path d="M14 17.5h7"/></svg></span>
          <span class="rb-txt">手动建组</span>
        </button>
        <div id="manualActions" data-mode="layout">
          <button id="finishBtn" class="rb-btn" type="button">
            <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg></span>
            <span class="rb-txt">完成</span>
          </button>
          <button id="cancelBtn" class="rb-btn" type="button">
            <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12"/><path d="m18 6-12 12"/></svg></span>
            <span class="rb-txt">取消</span>
          </button>
        </div>
        <button id="groupOverviewBtn" class="rb-btn" type="button" title="查看小组名单与人数">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><circle cx="4" cy="6" r="1.1"/><circle cx="4" cy="12" r="1.1"/><circle cx="4" cy="18" r="1.1"/></svg></span>
          <span class="rb-txt">小组总览</span>
        </button>
      </div>
      <div class="rb-label">小组</div>
    </div>

    <!-- 视图 -->
    <div class="rb-group" data-mode="layout">
      <div class="rb-row">
        <button id="gridSwitchWrap" class="rb-btn on" type="button" title="拖动座位时吸附到网格">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg></span>
          <span class="rb-txt">网格对齐</span>
        </button>
      </div>
      <div class="rb-label">视图</div>
    </div>

    <!-- 规则 -->
    <div class="rb-group" data-mode="layout">
      <div class="rb-row">
        <button id="allowEmptyBtn" class="rb-btn" type="button" title="允许座位数多于名单人数，多出来的座位留空">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 2.6"/><path d="M9 12h6"/></svg></span>
          <span class="rb-txt">允许空座</span>
        </button>
      </div>
      <div class="rb-label">规则</div>
    </div>

    <span class="rb-spacer"></span>

    <!-- 保存 -->
    <div class="rb-group" data-mode="layout">
      <div class="rb-row">
        <button id="saveBtn" class="rb-btn primary big" type="button">
          <span class="rb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v6h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></svg></span>
          <span class="rb-txt">保存格局</span>
        </button>
      </div>
      <div class="rb-label">保存</div>
    </div>

  </div>
</div>

<div id="canvas">
  <div id="world"></div>

  <div id="notice">
    <div class="notice-card">
      <h3 id="noticeTitle">还没有设定座位格局</h3>
      <p id="noticeText"></p>
      <div class="notice-actions">
        <button id="noticeGoBtn" class="rb-btn primary" type="button">去 EasyCore 设定座位格局</button>
        <button id="noticeReloadBtn" class="rb-icon-btn" type="button">重新加载</button>
      </div>
    </div>
  </div>

  <div id="loading"><div class="spinner"></div><span id="loadingText">加载中…</span></div>
</div>

<aside id="groupPanel">
  <div class="gp-head"><span id="gpTitle">小组总览</span><button id="groupPanelClose">×</button></div>
  <div class="gp-sub" id="gpSub">点击某一组可高亮它的座位</div>
  <div class="gp-body" id="groupPanelBody"></div>
</aside>

<div id="toast"><span class="toast-spin"></span><span id="toastText"></span></div>

<aside id="namePicker">
  <div class="np-head">
    <span class="np-title" id="npTitle">选择同学</span>
    <button class="np-close" id="namePickerClose" title="关闭">×</button>
  </div>
  <div class="np-sub" id="npSub"></div>
  <input id="npSearch" class="np-search" type="text" placeholder="搜索姓名…" autocomplete="off">
  <div class="np-body" id="npBody"></div>
</aside>

<div id="bottomBar">
  <div id="opHint">
    <div class="mouse-only" id="opHintMouse"></div>
    <div id="opHintTouch"></div>
  </div>
  <span id="zoomHint">缩放 100%</span>
</div>

<!-- 业务脚本：ES 模块，入口 js/main.js -->
<script type="module" src="js/main.js"></script>
</body>
</html>
